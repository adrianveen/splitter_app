[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitterapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-auth",
    "pytest",
    "pyinstaller",
    "pyside6>=6.6.2",
]

[tool.ruff]
line-length = 88
lint.extend-select = ["PTH", "NPY", "N8", "E", "ALL"]
lint.ignore = ["T2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
